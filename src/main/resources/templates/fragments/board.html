<div th:fragment="board" class="board-container glass-panel">
    <div id="board" class="board">
        <!-- Cells generated by Thymeleaf th:each -->
        <th:block th:each="row : ${boardRows}">
            <div th:each="num : ${row}" class="cell" th:attr="data-num=${num}" th:text="${num}"></div>
        </th:block>
        
        <!-- SVG for drawing snakes and ladders -->
        <svg id="svgOverlay" class="svg-overlay"></svg>
    </div>
</div>
